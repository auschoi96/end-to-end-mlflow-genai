command: [
  "uvicorn",
  "server.app:app"
]
# On-behalf-of auth: Databricks Apps forwards the calling user's OAuth token
# to this app (as X-Forwarded-Access-Token) and their identity (as
# X-Forwarded-Email/-User/-Preferred-Username) once the app has been granted
# the "serving.serving-endpoints" user-authorization scope. This is NOT
# configured here -- app.yaml has no effect on it. It's set via either the
# Databricks UI (app page > User authorization > +Add scope) or:
#   databricks apps update <app-name> --json '{"user_api_scopes": ["serving.serving-endpoints"]}'
# Users are prompted for one-time consent on first access after the scope is granted.
resources:
  - name: tracing-warehouse
    description: 'SQL warehouse for UC tracing + telco UC function calls'
    sql_warehouse:
      id: 75fd8278393d07eb
      permission: CAN_USE
env:
  - name: 'MLFLOW_TRACKING_URI'
    value: 'databricks'
  - name: 'MLFLOW_EXPERIMENT_ID'
    value: '2049197043893135'
  - name: 'MLFLOW_TRACING_SQL_WAREHOUSE_ID'
    value: '75fd8278393d07eb'
  - name: 'LOW_ACCURACY_RESULTS_URL'
    value: 'https://e2-demo-field-eng.cloud.databricks.com/ml/experiments/3301487308147308/evaluation-runs?selectedRunUuid=7d9bfc5c929c4d1f8ea10b6a570317dc&compareToRunUuid=816aefcc5d3a4f0ca0739b3f1f569526'
  - name: 'REGRESSION_RESULTS_URL'
    value: 'placeholder-regression-url'
  - name: 'METRICS_RESULT_URL'
    value: 'placeholder-metrics-url'
  - name: 'LLM_MODEL'
    value: 'databricks-claude-sonnet-4-6'
  # UC_CATALOG/UC_SCHEMA scope NFL agent prompts and UC tools. NFL data
  # (football_pbp_data, 7 UC functions, dc_assistant_system_prompt) lives
  # in users.austin_choi in this workspace. Telco UC functions live in
  # main.austin_choi_demo and are addressed separately via TELCO_FUNCTION_PREFIX.
  - name: 'UC_CATALOG'
    value: 'users'
  - name: 'UC_SCHEMA'
    value: 'austin_choi'
  # Curated single-turn eval dataset. Lives in nethra's schema because
  # users.austin_choi denies CREATE TABLE; app SP granted SELECT.
  - name: 'SINGLE_TURN_EVAL_DATASET_NAME'
    value: 'users.nethra_ranganathan.single_turn_eval_set'
  # Curated multi-turn/session eval dataset (10 sessions, 20 traces). Same
  # nethra's-schema constraint as above; app SP granted SELECT.
  - name: 'SESSION_EVAL_DATASET_NAME'
    value: 'users.nethra_ranganathan.multi_turn_eval_set'
  # Warehouse for reading eval dataset UC tables (get_dataset needs pyspark,
  # unavailable in the app container) and for session deep links.
  - name: 'SQL_WAREHOUSE_ID'
    value: '75fd8278393d07eb'
  - name: 'MLFLOW_ENABLE_ASYNC_TRACE_LOGGING'
    value: 'false'
  # Keeps multimodal image content as raw base64 data URIs in trace spans
  # instead of MLflow auto-extracting them into mlflow-attachment:// refs --
  # this workspace's trace UI renders raw base64 data URIs inline but does
  # not yet resolve mlflow-attachment:// URIs, so extraction breaks the
  # Multi-Modal Tracing demo's image rendering.
  - name: 'MLFLOW_TRACE_EXTRACT_ATTACHMENTS'
    value: 'false'
  - name: 'PROMPT_NAME'
    value: 'dc_assistant_system_prompt'
  - name: 'PROMPT_ALIAS'
    value: 'production'
  - name: 'REGRESSION_BASELINE_RUN_ID'
    value: '8136cdb72d664267811cd4ff0fc5b636'
  - name: 'FIX_QUALITY_BASELINE_RUN_ID'
    value: '816aefcc5d3a4f0ca0739b3f1f569526'
  - name: 'SAMPLE_LABELING_SESSION_ID'
    value: '30561d78-a6f2-45df-ba80-98f70cc3d6ea'
  - name: 'SAMPLE_REVIEW_APP_URL'
    value: 'https://e2-demo-west.cloud.databricks.com/ml/review-v2/2c222d18dea64c81b9c6caa9a11d7e17/tasks/labeling/cc430fac-995b-414c-aeff-8d5c4f266947/items/1622fef8-d5da-4dfc-b037-4a5fee1e73dc?sqlWarehouseId=75fd8278393d07eb&o=2556758628403379'
  - name: 'SAMPLE_LABELING_TRACE_ID'
    value: 'trace:/main.austin_choi_demo.nfl_dc_assistant_trace/93e75ddd0567c51b8decfd7370400936'
  - name: 'SAMPLE_TRACE_ID'
    value: 'trace:/main.austin_choi_demo.nfl_dc_assistant_trace/766403c82adfcf46aa87b248cac90b46'
  - name: 'LHA_SOURCE_CODE_PATH'
    value: '/Workspace/Users/amine.elhelou@databricks.com/mlflow-nfl-demo-app-aeh'
  # Notebook URLs for in-app "Open in Databricks" buttons. Notebooks live in
  # e2-demo-west under /Users/austin.choi@databricks.com/end-to-end-mlflow-genai.
  # Source: https://github.com/auschoi96/end-to-end-mlflow-genai (00 → 06).
  # Mapping: demo-page button -> new notebook (00_setup is uploaded but not
  # surfaced through a button per current product decision).
  - name: 'NOTEBOOK_URL_1_observe_with_traces'
    value: 'https://e2-demo-west.cloud.databricks.com/editor/notebooks/1280096806371701'
  - name: 'NOTEBOOK_URL_2_create_quality_metrics'
    value: 'https://e2-demo-west.cloud.databricks.com/editor/notebooks/1280096806371702'
  - name: 'NOTEBOOK_URL_3_collect_ground_truth_labels'
    value: 'https://e2-demo-west.cloud.databricks.com/editor/notebooks/1280096806371703'
  - name: 'NOTEBOOK_URL_4_align_judges_to_experts'
    value: 'https://e2-demo-west.cloud.databricks.com/editor/notebooks/1280096806371704'
  - name: 'NOTEBOOK_URL_5_optimize_prompts'
    value: 'https://e2-demo-west.cloud.databricks.com/editor/notebooks/1280096806371705'
  - name: 'NOTEBOOK_URL_6_production_monitoring'
    value: 'https://e2-demo-west.cloud.databricks.com/editor/notebooks/1280096806371706'
  # Telco support agent (landing page + first sidebar entry)
  # The agent now runs in-process via the OpenAI Agents SDK. It calls UC
  # functions in main.austin_choi_demo, no separate serving endpoint needed.
  - name: 'TELCO_MODEL'
    value: 'databricks-claude-sonnet-4-5'
  - name: 'TELCO_FUNCTION_PREFIX'
    value: 'main.austin_choi_demo'
  - name: 'TELCO_MLFLOW_EXPERIMENT_ID'
    value: '2049197043893135'
  - name: 'TELCO_MLFLOW_EXPERIMENT_PATH'
    value: '/Users/austin.choi@databricks.com/NFL_dc_assistant_uc'
  - name: 'DEMO_CUSTOMER_IDS'
    value: 'CUS-10001,CUS-10002,CUS-10006,CUS-10023,CUS-10048,CUS-10172,CUS-11081,CUS-10619'
  - name: 'ENV'
    value: 'prod'
